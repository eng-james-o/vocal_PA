[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = --cov=core --cov=models --cov=utils --cov-report=term-missing --cov-report=html
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    unit: marks unit tests

[pytest-coverage]
; Options for pytest-cov
source = core, models, utils
report =
    term-missing
    html
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:run]
concurrency = multiprocessing
parallel = True

[coverage:report]
show_missing = True
skip_covered = False
precision = 2

[coverage:html]
directory = htmlcov
