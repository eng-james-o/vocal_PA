[metadata]
name = vocal-range-analyzer
version = 0.1.0-alpha
author = eng-james-o
author_email = eng-james-o@users.noreply.github.com
description = A powerful Python application for vocalists to scientifically measure their vocal range
glong_description = file: README.md
url = https://github.com/eng-james-o/vocal_PA
project_urls =
    Bug Tracker = https://github.com/eng-james-o/vocal_PA/issues
    Documentation = https://github.com/eng-james-o/vocal_PA/docs
    Source Code = https://github.com/eng-james-o/vocal_PA
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: End Users/Desktop
    Intended Audience :: Education
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Artistic Software
    Topic :: Multimedia :: Sound/Audio
    Topic :: Education
    Framework :: Qt
python_requires = >=3.9

[options]
zip_safe = False
include_package_data = True
packages = find:
    include = core*
    include = models*
    include = utils*
    include = ui*
package_dir =
    = .

[options.packages.find]
exclude =
    tests*
    docs*
    venv*
    .venv*

[flake8]
max-line-length = 88
exclude =
    .venv,
    __pycache__,
    build,
    dist,
    *.egg-info,
    tests/,
    docs/,
    ui/
target-version = py39
ignore =
    E203
    W503
max-complexity = 10
select = E,F,W,C,N

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_optional = True
warn_signature_compat = True
warn_incomplete_stub = True

[[mypy.overrides]]
module = tests.*
disallow_untyped_defs = False

[black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[isort]
profile = black
line_length = 88
known_first_party = core, models, utils, ui, tests
known_third_party = PySide6, numpy, librosa, sounddevice, music21, pytest
